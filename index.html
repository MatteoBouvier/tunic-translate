<!DOCTYPE html>
<html lang="en_US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Tunic translate</title>

        <link href="css/style.css" rel="stylesheet">
        <link href="css/colors.css" rel="stylesheet">
        <link href="css/segments.css" rel="stylesheet">
        <link href="css/images.css" rel="stylesheet">
        <link href="css/text.css" rel="stylesheet">

        <link rel="icon" href="favicon.ico" type="image/x-icon">
    </head>
    <body>
        <div id="save-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="448" height="512" viewBox="0 0 448 512"><path fill="currentColor" d="M64 80c-8.8 0-16 7.2-16 16v320c0 8.8 7.2 16 16 16h320c8.8 0 16-7.2 16-16V173.3c0-4.2-1.7-8.3-4.7-11.3L320 86.6V176c0 17.7-14.3 32-32 32H128c-17.7 0-32-14.3-32-32V80zm80 0v80h128V80zM0 96c0-35.3 28.7-64 64-64h242.7c17 0 33.3 6.7 45.3 18.7l77.3 77.3c12 12 18.7 28.3 18.7 45.3V416c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64zm160 224a64 64 0 1 1 128 0a64 64 0 1 1-128 0"/></svg>
            save
        </div>
        <div id="load-button">
            <label for="fileupload">
                <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"><path fill="currentColor" d="M240 136v64a16 16 0 0 1-16 16H32a16 16 0 0 1-16-16v-64a16 16 0 0 1 16-16h48a8 8 0 0 1 0 16H32v64h192v-64h-48a8 8 0 0 1 0-16h48a16 16 0 0 1 16 16M85.66 77.66L120 43.31V128a8 8 0 0 0 16 0V43.31l34.34 34.35a8 8 0 0 0 11.32-11.32l-48-48a8 8 0 0 0-11.32 0l-48 48a8 8 0 0 0 11.32 11.32M200 168a12 12 0 1 0-12 12a12 12 0 0 0 12-12"/></svg>
                load
            </label>
            <input id="fileupload" type="file" style="visibility: hidden; width: 0;">
        </div>
        <div class="box">
            <div class="row">
                <div class="box">
                    <div id="image-gallery">
                        <div id="gallery-previous" class="gallery-arrow" onmousedown="display_previous_page()"></div>
                        <img src="" alt="" data-offset-x=0 data-offset-y=0 onmousemove="handle_zoom_in(this, event)" onmouseout="handle_zoom_out(this)">
                        <div id="gallery-next" class="gallery-arrow" onmousedown="display_next_page()"></div>
                    </div>
                    
                    <div id="gallery-buttons"></div>
                </div>
            </div>

            <div id="text-buffer-container"></div>
        </div>

        <div class="drawer">
            <div class="drawer-shadow" onclick="page_buffer_collection.current_page.get_active().mode = Mode.normal"></div>
            <div class="drawer-content">
                <div class="drawer-header">
                    Search word
                    <button type="button" onclick="page_buffer_collection.current_page.get_active().mode = Mode.normal">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 32 32">
                            <path fill="currentColor" d="M24.879 2.879A3 3 0 1 1 29.12 7.12l-8.79 8.79a.125.125 0 0 0 0 .177l8.79 8.79a3 3 0 1 1-4.242 4.243l-8.79-8.79a.125.125 0 0 0-.177 0l-8.79 8.79a3 3 0 1 1-4.243-4.242l8.79-8.79a.125.125 0 0 0 0-.177l-8.79-8.79A3 3 0 0 1 7.12 2.878l8.79 8.79a.125.125 0 0 0 .177 0z"/>
                        </svg>
                    </button>
                </div>
                <input type="text" value="", id="search-input" oninput="populate_search_list(page_buffer_collection.words.search(this.value))">
                <div class="drawer-body"></div>
            </div>
        </div>

        <script src="./js/bundle.js"></script>
    </body>
</html>
